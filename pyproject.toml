[project]
name = "robosim"
version = "0.1.0"
description = "Minimal Isaac-Lab-style physics simulator for robot control policy training (MuJoCo + Gymnasium + SB3)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mujoco>=3.1.6",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3.0",
    "sb3-contrib>=2.3.0",
    "torch>=2.2",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "onnxscript>=0.1",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tensorboard>=2.16",
    "numpy>=1.26",
    "imageio>=2.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
robosim = "robosim.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robosim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
